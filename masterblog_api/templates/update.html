<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>Update Blog Post</h1>

    <form class="post-form" action="{{ url_for('update_post', post_id=post['id']) }}" method="POST">
        <label for="title">Title:</label><br>
        <input type="text" id="title" name="title" value="{{ post['title'] }}"><br>
        <label for="author">Author:</label><br>
        <input type="text" id="author" name="author" value="{{ post['author'] }}"><br>
        <label for="content">Content:</label><br>
        <input type="text" id="content" name="content" value="{{ post['content'] }}"><br>
        <input type="submit" value="Update">
    </form>
    <a href="{{ url_for('index') }}" class="back-link">back to Home page</a>
</body>

</html>
